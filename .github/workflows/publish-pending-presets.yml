name: Publish pending colour presets
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: colour-preset-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PRESET_API_URL: https://seeq-lightbar-presets.kennethlauridsen.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Obtain short-lived publisher identity
        shell: bash
        run: |
          OIDC_TOKEN=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=seeq-lightbar-presets" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$OIDC_TOKEN"
          echo "OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"
      - name: Fetch pending submissions
        run: |
          test -n "$PRESET_API_URL"
          curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$PRESET_API_URL/v1/pending" > "$RUNNER_TEMP/pending.json"
      - name: Validate and publish files
        run: python presets/publish_pending_presets.py "$RUNNER_TEMP/pending.json" presets "$RUNNER_TEMP/published-ids.json"
      - name: Commit published presets
        run: |
          if git diff --quiet -- presets/index.json presets/files; then exit 0; fi
          git config user.name "Seeq preset publisher"
          git config user.email "actions@users.noreply.github.com"
          git add presets/index.json presets/files
          git commit -m "Publish queued colour presets"
          git push
      - name: Acknowledge processed submissions
        run: |
          test -f "$RUNNER_TEMP/published-ids.json" || exit 0
          python -c "import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))['ids'] else 1)" "$RUNNER_TEMP/published-ids.json" || exit 0
          curl --fail --silent --show-error --retry 3 \
            -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/published-ids.json" "$PRESET_API_URL/v1/ack"
