name: Publish OTA release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify staged firmware
        run: test -f "firmware/core-one-lightbar-${GITHUB_REF_NAME}.bin"
      - name: Create public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "firmware/core-one-lightbar-${GITHUB_REF_NAME}.bin" --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes "Binary-only firmware release for anonymous OTA installation."
