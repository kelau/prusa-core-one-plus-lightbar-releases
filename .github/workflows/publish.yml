name: Publish OTA release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify staged firmware
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test -f "firmware/core-one-lightbar-${GITHUB_REF_NAME}.bin"
          test -s "firmware/release-notes-${GITHUB_REF_NAME}.md"
      - name: Create public prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "firmware/core-one-lightbar-${GITHUB_REF_NAME}.bin"
          --verify-tag --prerelease --title "$GITHUB_REF_NAME"
          --notes-file "firmware/release-notes-${GITHUB_REF_NAME}.md"
      - name: Generate release catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python tools/generate_release_catalogue.py "$RUNNER_TEMP/releases.json" firmware/releases.json
      - name: Publish release catalogue
        run: |
          git config user.name "CORE ONE+ release automation"
          git config user.email "actions@users.noreply.github.com"
          git add firmware/releases.json
          git diff --cached --quiet && exit 0
          git commit -m "Update OTA release catalogue"
          git push origin main
